<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="kronto" />
    <title>kronto</title>
    <!--
      До первой отрисовки: тема без вспышки светлой (повторяет applyTheme из
      src/lib/theme.ts) и признак «здесь входили» (api/session.ts) — готовый
      HTML сайта у вошедшего скрыт до отрисовки приложения (base.css). Хеш
      скрипта разрешён в CSP (nginx.conf) — после правки пересчитайте его,
      тест src/lib/csp.test.ts подскажет новый.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var choice = null;
        var signedIn = false;
        try {
          choice = localStorage.getItem("kronto.theme");
          signedIn = localStorage.getItem("kronto.signedIn") === "1";
        } catch (e) {}
        if (signedIn) root.setAttribute("data-session", "");
        if (choice === "light" || choice === "dark") root.setAttribute("data-theme", choice);
        var dark =
          choice === "dark" ||
          (choice !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1c1b19" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
