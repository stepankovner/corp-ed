# Статика фронтенда Kronto. TLS, HSTS и маршрут /api — на внешнем прокси.

# Сайт индексируется только на боевом домене: образ один для стенда и боя,
# стенд и прочие адреса закрыты от поисковиков заголовком и robots.txt.
map $host $kronto_robots {
    krontoai.ru "";
    www.krontoai.ru "";
    default "noindex, nofollow";
}
map $host $kronto_robots_file {
    krontoai.ru /robots.txt;
    www.krontoai.ru /robots.txt;
    default /robots-closed.txt;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Заголовки безопасности. style-src 'unsafe-inline' — Radix (модальные
    # окна) вставляет <style> для блокировки прокрутки; скрипты — только свои
    # и встроенный скрипт темы из index.html по хешу (сверяет csp.test.ts).
    # X-Frame-Options — запрет фрейма для браузеров без frame-ancestors.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-9dqbHmjn/tnsQUoCM9XQ+98rW+Y8MKzG00o8p10aptw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Файлы сборки с хешем в имени — навсегда в кеше.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Карты исходников сборке не нужны снаружи.
    location ~ \.map$ {
        return 404;
    }

    location = /robots.txt {
        try_files $kronto_robots_file =404;
    }

    # Установка на телефон (ТЗ §11): тип манифеста — явно, в mime.types
    # его может не быть.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Страницы сайта — готовый HTML (dist/<адрес>/index.html, предрендер при
    # сборке), остальные адреса — оболочка приложения app.html. HTML не
    # кешируем, чтобы новая выкладка подхватывалась сразу.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-9dqbHmjn/tnsQUoCM9XQ+98rW+Y8MKzG00o8p10aptw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag $kronto_robots always;
        try_files $uri $uri/index.html /app.html;
    }

    # Запрос к API, дошедший сюда, — ошибка маршрута на прокси.
    location /api/ {
        return 502;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;
    gzip_min_length 1024;
}
