[project]
name = "corp-ed"
version = "0.1.0"
description = "AI-powered onboarding programs for interns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "mammoth>=1.8",
    "markdownify>=0.14",
    "numpy>=2.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.20",
    "razdel>=0.5.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.50",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corp_ed"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.16",
    "snowballstemmer>=3.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (стиль из PEP 8)
    "W",    # pycodestyle warnings
    "F",    # pyflakes (неиспользуемые импорты/переменные, реальные ошибки)
    "I",    # isort (сортировка импортов)
    "N",    # pep8-naming (правила именования)
    "UP",   # pyupgrade (модернизация устаревшего синтаксиса)
    "B",    # flake8-bugbear (потенциальные баги)
    "SIM",  # flake8-simplify (упрощение кода)
    "S",    # flake8-bandit (типовые дыры: shell=True, eval, слабые хеши, секреты в коде)
]

[tool.ruff.lint.per-file-ignores]
# Тесты: assert — их язык; пароли и токены в них ненастоящие; random —
# тестовые данные; subprocess и f-строка SQL — над нашими же константами.
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S608"]
# Скрипты eval (ML): random — бутстреп и выборки, не криптография.
"eval/**" = ["S311"]

[tool.coverage.run]
branch = true
source = ["corp_ed"]

[tool.coverage.report]
# Порог для CI (pytest --cov): ниже — сборка красная. Не цель, а
# страховка от коммитов без тестов; поднимать по мере роста.
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
