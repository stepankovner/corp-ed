[project]
name = "corp-ed"
version = "0.1.0"
description = "Learning Management System — educational project for backend/MLOps practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "sqlalchemy[asyncio]>=2.0.50",
    "structlog>=26.1.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lms"]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (стиль из PEP 8)
    "W",    # pycodestyle warnings
    "F",    # pyflakes (неиспользуемые импорты/переменные, реальные ошибки)
    "I",    # isort (сортировка импортов)
    "N",    # pep8-naming (правила именования)
    "UP",   # pyupgrade (модернизация устаревшего синтаксиса)
    "B",    # flake8-bugbear (потенциальные баги)
    "SIM",  # flake8-simplify (упрощение кода)
]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
