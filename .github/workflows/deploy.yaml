name: Deploy

# Тестовый стенд (docs/STAGE.md). После зелёного CI на main выкатывается
# сам; любую ветку этого репозитория — кнопкой Run workflow (выбрать
# ветку), любой прошлый коммит (откат) — там же, полем sha. Образы
# собираются здесь и уходят в GHCR; сервер их только скачивает — там нет
# ни сборки, ни npm, ни uv. После выкатки сервер сам прогоняет сквозную
# проверку (python -m corp_ed.stand check) с настоящей моделью.
#
# Включается переменной репозитория STAGE_ENABLED=true, когда сервер
# настроен (deploy/stage/bootstrap.sh). До этого workflow пропускается.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Коммит для выкатки (откат); пусто — голова выбранной ветки"
        required: false
        default: ""

permissions:
  contents: read

# Одна выкатка за раз; новая ждёт, а не отменяет бегущую: наполовину
# выкаченный стенд хуже старого.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

# Исполнитель — переменная репозитория RUNS_ON (docs/CI-RUNNER.md, как в
# ci.yaml). Ключ выкатки и логин GHCR — в RUNNER_TEMP, не в домашнем
# каталоге: на своём runner он общий у всех заданий и переживает job, а
# RUNNER_TEMP runner очищает в начале и в конце каждого job.
jobs:
  images:
    name: Build and push images
    # Из workflow_run — только push в main этого репозитория: у PR из
    # форка тоже бывает ветка с именем main.
    if: >-
      vars.STAGE_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run: коммит, который проверил CI, а не текущий main.
          # Сервер всё равно примет только коммит из ветки этого репозитория.
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Образы Docker Hub — через зеркало Google: с общих адресов машин
      # GitHub Docker Hub режет скачивание без входа (как в ci.yaml).
      - name: Docker Hub through a mirror
        if: runner.environment == 'github-hosted'
        run: |
          conf=/etc/docker/daemon.json
          current=$(sudo cat "$conf" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' \
            | sudo tee "$conf" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'
      - name: Build and push
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          # source связывает пакет с репозиторием (видимость, страница пакета).
          labels=(--label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
                  --label "org.opencontainers.image.revision=$SHA")
          docker build "${labels[@]}" -t "$prefix/kronto-api:$SHA" .
          docker build "${labels[@]}" -t "$prefix/kronto-web:$SHA" frontend
          docker push --quiet "$prefix/kronto-api:$SHA"
          docker push --quiet "$prefix/kronto-web:$SHA"

  deploy:
    name: Deploy to the stage
    needs: images
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    # Токен job — скачать образы из GHCR на сервере: пакеты могут
    # оставаться приватными. Живёт до конца job.
    permissions:
      contents: read
      packages: read
    # Секрет STAGE_SSH_KEY — секрет репозитория, а не окружения: в
    # приватном репозитории environments есть только на платных тарифах
    # GitHub. Ключ на сервере умеет только `deploy <sha>` и `check`, и
    # выкатывает только коммиты из веток этого репозитория (STAGE.md §3).

    steps:
      - name: SSH key and pinned host key
        env:
          SSH_KEY: ${{ secrets.STAGE_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/stage"
          chmod 600 "$RUNNER_TEMP/ssh/stage"
          # Ключ хоста закреплён заранее: StrictHostKeyChecking=no — это
          # подмена сервера на выкатке.
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy
        env:
          SHA: ${{ needs.images.outputs.sha }}
          HOST: ${{ vars.STAGE_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Ключ на сервере привязан к kronto-deploy (deploy/stage/ssh-entry.sh):
        # другой команды с ним не выполнить. Токен — через stdin, не в
        # командной строке.
        run: |
          printf '%s\n' "$GH_TOKEN" |
            ssh -i "$RUNNER_TEMP/ssh/stage" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$HOST" "deploy $SHA"

      - name: Reachable from outside
        env:
          DOMAIN: ${{ vars.STAGE_DOMAIN }}
        run: |
          curl -fsS --max-time 10 "https://$DOMAIN/health"
          curl -fsS --max-time 10 -o /dev/null "https://$DOMAIN/"

      # Вход, загрузка, индексация, ответ модели со ссылкой, кредиты. Пароль
      # проверочной компании живёт только на сервере (deploy/stage/check.sh).
      - name: Stand check
        env:
          HOST: ${{ vars.STAGE_HOST }}
        run: |
          ssh -i "$RUNNER_TEMP/ssh/stage" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$HOST" check < /dev/null
