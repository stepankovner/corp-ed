name: CI

on:
  # push — только main: ветку PR проверяет pull_request. С push на
  # любую ветку каждый пуш в PR запускал прогон дважды, а минуты Actions
  # у приватного репозитория ограничены (02.10 выкатка #56 не получила исполнителя).
  #
  # Только документация (docs/, *.md) — без прогона: ни код, ни тесты её
  # не читают. Слияние одной документации в main не запускает и выкатку.
  # Для pull_request фильтр смотрит на весь PR; коммит с одной
  # документацией в PR с кодом пропускает задание changes.
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

# Токен workflow — только чтение. Ни одному шагу здесь не нужно писать в
# репозиторий; утёкший токен с правом записи — это подмена кода.
permissions:
  contents: read

# Новый push в ту же ветку отменяет ещё бегущий прогон.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"
  NODE_VERSION: "22"

# Исполнитель — переменная репозитория RUNS_ON: ["self-hosted","kronto"] —
# свой runner (docs/CI-RUNNER.md), не задана — машины GitHub. На своём
# runner задания делят одну машину и один Docker: порты сервисов на хосте
# случайные, теги образов — с номером прогона.
jobs:
  # Новый коммит в PR меняет только документацию, а предыдущий коммит PR
  # прошёл CI целиком (или сам был таким же коммитом) — остальные задания
  # пропускаются. Прогон предыдущего коммита отменён (concurrency), упал
  # или его нет — проверяется всё: иначе код из отменённого прогона
  # остался бы непроверенным.
  changes:
    name: Code changed
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # прогоны CI предыдущего коммита
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          code=true
          if [ "$ACTION" = synchronize ] && [ -n "$BEFORE" ] \
            && git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            echo "Изменено с $BEFORE:"
            printf '%s\n' "$changed"
            # here-string, не конвейер: с pipefail ранний выход grep -q
            # (SIGPIPE у printf) читался бы как «только документация».
            if [ -n "$changed" ] && ! grep -qvE '^docs/|\.md$' <<<"$changed"; then
              ok=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "$API/actions/workflows/ci.yaml/runs?head_sha=$BEFORE&event=pull_request&per_page=20" \
                | jq '[.workflow_runs[] | select(.conclusion == "success")] | length' || echo 0)
              if [ "$ok" -gt 0 ]; then
                code=false
              else
                echo "Прогон CI для $BEFORE не прошёл целиком — проверяется всё."
              fi
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint, types, tests
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: corp_ed
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corp_ed_test
        # Порт хоста — случайный: 5432:5432 у второго задания на той же
        # машине не поднимется.
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Лимиты частоты и квота эмбеддингов: тесты Redis-реализаций
      # пропускаются без TEST_REDIS_URL, а пропуск в CI — дыра.
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run ruff (linter, incl. bandit rules)
        run: uv run ruff check

      - name: Run ruff (formatter check)
        run: uv run ruff format --check

      - name: Run mypy (type checker)
        run: uv run mypy

      - name: Run pytest with coverage threshold
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://corp_ed:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/corp_ed_test
          TEST_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/15
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Frontend lint, types, tests, build
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd .. && uv python install 3.12 && uv sync --frozen --dev)

      # Типы клиента генерируются из схемы бэкенда: расхождение — это
      # фронт, который собирается, но шлёт не те поля.
      - name: API types match the backend schema
        run: npm run check:api

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: End-to-end (browser against the API, fake LLM)
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: corp_ed
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corp_ed
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    # Режим разработки без ключей Yandex Cloud: ответ — из первой выдержки,
    # эмбеддинги — «мешок слов» (llm/fake.py). Порог расстояния для них
    # мягче боевого (.env.example). Адреса базы, Redis, API и фронта — шаг
    # Ports: порты на хосте у каждого задания свои.
    env:
      SECRET_KEY: ci-only-e2e-secret-key-0123456789abcdef
      LLM_PROVIDER: fake
      EMBEDDING_DIM: "768"
      RAG_CHUNK_TOKENS: "400"
      RAG_OVERLAP_TOKENS: "50"
      RAG_FAQ_LIMIT: "5"
      RAG_FAQ_MAX_DISTANCE: "0.8"
      RAG_CONTEXT_MAX_TOKENS: "3000"
      RAG_FAQ_TEMPERATURE: "0"
      RAG_RETRIEVER: vector
      RAG_FULLTEXT_WEIGHT: "0.5"
      # Запись на созвон открыта тестовой политикой (в бою — LEADS_* стенда).
      LEADS_ENABLED: "true"
      LEADS_POLICY_URL: https://kronto.example/privacy
      LEADS_POLICY_VERSION: e2e
      E2E_COMPANY: e2e
      E2E_ADMIN_EMAIL: admin@kronto-e2e.ru
      # Метрики воркера — на постоянном порту 9101; на своём runner второе
      # задание e2e на той же машине упало бы на нём. Здесь не нужны.
      WORKER_METRICS_PORT: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Библиотеки Chromium (--with-deps) ставятся через sudo; на своём runner
      # sudo нет — их поставил deploy/ci-runner/setup.sh, здесь только браузер.
      - name: Install dependencies
        run: |
          uv python install 3.12 && uv sync --frozen --dev
          cd frontend && npm ci --no-audit --no-fund
          npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      # Порты API и фронта — свободные, а не 8000/4173: на своём runner
      # второе задание e2e может идти на той же машине.
      - name: Ports
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          read -r api_port web_port < <(python3 -c 'import socket
          s = [socket.socket() for _ in range(2)]
          for x in s: x.bind(("127.0.0.1", 0))
          print(*(x.getsockname()[1] for x in s))')
          {
            echo "DATABASE_URL=postgresql+asyncpg://corp_ed:postgres@localhost:$PG_PORT/corp_ed"
            echo "REDIS_URL=redis://localhost:$REDIS_PORT/0"
            echo "API_PORT=$api_port"
            # Прокси /api у vite preview (frontend/vite.config.ts).
            echo "KRONTO_BACKEND=http://127.0.0.1:$api_port"
            echo "WEB_PORT=$web_port"
            echo "E2E_BASE_URL=http://localhost:$web_port"
          } >> "$GITHUB_ENV"

      - name: Migrate and create a company
        run: |
          uv run alembic upgrade head
          # Временный пароль задаёт оператор, CLI его не печатает (RISKS №42).
          password="E2e-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          printf '%s\n' "$password" | uv run python -m corp_ed.cli create-tenant \
            --code "$E2E_COMPANY" --name "E2E" --seats 5 --admin-email "$E2E_ADMIN_EMAIL" \
            --admin-password-stdin
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start API, worker and the built frontend
        run: |
          nohup uv run uvicorn corp_ed.main:app --port "$API_PORT" > api.log 2>&1 &
          nohup uv run python -m corp_ed.worker > worker.log 2>&1 &
          (cd frontend && npm run build && nohup npx vite preview --port "$WEB_PORT" --strictPort > ../web.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -sf "localhost:$API_PORT/health" >/dev/null && curl -sf "$E2E_BASE_URL/" >/dev/null && exit 0
            sleep 1
          done
          echo "::error::stand did not start"; tail -50 api.log worker.log web.log; exit 1

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      # Заявка с формы дошла до команды: CLI видит её среди новых.
      - name: Lead reaches the team CLI
        run: uv run python -m corp_ed.cli leads list | grep -q "E2E Лид"

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
            worker.log
            web.log
          retention-days: 7

  migrations:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Migrations on a fresh database
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: corp_ed
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corp_ed
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: corp_ed
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv python install 3.12 && uv sync --frozen --dev

      # Порт базы на хосте — случайный (см. checks): контекст job в env
      # задания недоступен, поэтому — через GITHUB_ENV.
      - name: Database port
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          {
            echo "PGPORT=$PG_PORT"
            # Миграции идут под владельцем схемы БЕЗ суперпользователя — как в
            # бою. Под суперпользователем FORCE RLS не действует, и миграция,
            # которая под ним проходит, может молча не увидеть ни одной строки
            # у настоящего владельца (docs/DECISIONS.md, ловушка RLS).
            echo "MIGRATIONS_DATABASE_URL=postgresql+asyncpg://corp_ed_owner:owner@localhost:$PG_PORT/corp_ed_migrations"
          } >> "$GITHUB_ENV"

      - name: Create a non-superuser schema owner
        run: |
          psql -v ON_ERROR_STOP=1 -d corp_ed <<'SQL'
          CREATE ROLE corp_ed_owner LOGIN PASSWORD 'owner'
              NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE DATABASE corp_ed_migrations OWNER corp_ed_owner;
          SQL
          # Расширение ставит администратор базы, не миграция (нужен superuser).
          psql -v ON_ERROR_STOP=1 -d corp_ed_migrations -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Upgrade, check drift, downgrade, upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Application role has data access only
        # Скрипт запускает администратор базы (в Docker — POSTGRES_USER при
        # первой инициализации тома): создать роль владелец схемы не вправе.
        env:
          POSTGRES_USER: corp_ed
          POSTGRES_DB: corp_ed_migrations
          APP_DB_PASSWORD: app
        run: |
          sh deploy/postgres/10-app-role.sh
          export PGUSER=corp_ed_app PGPASSWORD=app PGDATABASE=corp_ed_migrations
          # Данные — можно.
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM tenants"
          # DDL — нельзя.
          if psql -c "CREATE TABLE should_fail (id int)"; then
            echo "::error::application role can create tables"; exit 1
          fi
          # Ни SUPERUSER, ни BYPASSRLS.
          test "$(psql -tAc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user")" = "f"

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Docker image builds and runs unprivileged
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    # Тег — свой у прогона: на своём runner Docker общий, и kronto-api:ci
    # параллельного прогона подменил бы проверяемый образ.
    env:
      TAG: ci-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t "kronto-api:$TAG" .

      - name: Image smoke test
        run: |
          # Не root.
          test "$(docker run --rm "kronto-api:$TAG" id -u)" != "0"
          # Приложение импортируется, CLI и alembic на месте.
          docker run --rm -e SECRET_KEY=ci-only-secret-key-0123456789abcdef -e DATABASE_URL=postgresql+asyncpg://x:x@db/x \
            "kronto-api:$TAG" python -c "import corp_ed.main, corp_ed.worker, corp_ed.cli"
          docker run --rm "kronto-api:$TAG" python -m corp_ed.cli --help >/dev/null
          docker run --rm "kronto-api:$TAG" alembic --help >/dev/null
          # Песочница парсера: rlimits ставятся в дочернем процессе.
          docker run --rm "kronto-api:$TAG" python -c "import resource, corp_ed.ingest.extract_worker"

      - name: Build web image
        run: docker build -t "kronto-web:$TAG" frontend

      - name: Web image smoke test
        run: |
          # Порт хоста — случайный, контейнер удаляется на выходе: на своём
          # runner машина после задания остаётся.
          web=$(docker run -d -p 127.0.0.1::8080 "kronto-web:$TAG")
          trap 'docker rm -f "$web" >/dev/null' EXIT
          port=$(docker port "$web" 8080/tcp | head -1)
          base="http://localhost:${port##*:}"
          for _ in $(seq 1 20); do curl -sf "$base/healthz" >/dev/null && break; sleep 1; done
          # Не root.
          test "$(docker exec "$web" id -u)" != "0"
          # Маршрут приложения отдаёт index.html, с CSP.
          curl -sf "$base/admin/users" | grep -q '<div id="root">'
          curl -sI "$base/" | grep -qi "content-security-policy: default-src 'self'"
          # Карты исходников наружу не отдаются.
          map=$(docker exec "$web" sh -c 'ls /usr/share/nginx/html/assets/*.map | head -1 | xargs basename')
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/$map")" = "404"

      - name: Remove images
        if: always()
        run: docker image rm -f "kronto-api:$TAG" "kronto-web:$TAG" >/dev/null 2>&1 || true
