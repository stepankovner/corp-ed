name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corp_ed
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corp_ed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run ruff (linter)
        run: uv run ruff check

      - name: Run ruff (formatter check)
        run: uv run ruff format --check

      - name: Run mypy (type checker)
        run: uv run mypy

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://corp_ed:postgres@localhost:5432/corp_ed_test
        run: uv run pytest -q
