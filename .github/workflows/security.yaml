name: Security

# Проверки, которые ловят проблемы без изменения кода: новые CVE в
# зависимостях и в базовом образе. Поэтому — ещё и по расписанию.
on:
  # push — только main: ветку PR проверяет pull_request. С push на
  # любую ветку каждый пуш в PR запускал прогон дважды, а минуты Actions
  # у приватного репозитория ограничены (02.10 выкатка #56 не получила исполнителя).
  #
  # На PR — быстрые проверки (зависимости, секреты), в том числе для
  # коммитов с одной документацией: ключ легко вставить в инструкцию.
  # CodeQL и Trivy (4 и 2 минуты) — на main и по расписанию.
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]   # документацию уже проверил PR
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # понедельник, 06:17 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"
  NODE_VERSION: "22"

# Исполнитель — переменная репозитория RUNS_ON (docs/CI-RUNNER.md, как в ci.yaml);
# PR из форка — всегда машины GitHub.
jobs:
  dependencies:
    name: Known vulnerabilities in dependencies (pip-audit)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # Проверяется ровно то, что уходит в образ: боевые зависимости из
      # uv.lock, без dev-группы. --no-deps: список уже полный и закреплён.
      - name: Export locked production requirements
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
      # Тот же Python, что в образе: часть пакетов не ставится на другой.
      - name: pip-audit
        run: uvx --python 3.12 pip-audit --requirement requirements.txt --no-deps --strict --desc on

  frontend-dependencies:
    name: Known vulnerabilities in frontend dependencies (npm audit)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # В образ уходит только сборка, но в неё попадают боевые
      # зависимости из package-lock.json; dev-инструменты (Vite, ESLint,
      # Playwright) в браузер не попадают. Порог — high, как у Trivy.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secrets in history (gitleaks)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      # На pull_request gitleaks-action читает список коммитов PR через API:
      # в приватном репозитории (с 30.09) без этого права — 403.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # вся история: ключ, удалённый следующим коммитом, всё ещё в ней
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Static analysis (CodeQL)
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # результаты — во вкладку Security репозитория
      # Как в шаблоне CodeQL: analyze читает свой запуск workflow — без
      # этого на push в ветку «Resource not accessible by integration».
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:python"

  # Отдельное задание, не матрица: имя проверки и история алертов
  # Python-анализа остаются прежними.
  codeql-frontend:
    name: Static analysis of the frontend (CodeQL)
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:javascript-typescript"

  image:
    name: Image vulnerabilities and SBOM (Trivy)
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    # Тег — свой у прогона: на своём runner Docker общий у параллельных
    # заданий. Кэш Trivy — свой у каждого runner ($RUNNER_NAME): Trivy держит
    # блокировку кэша, пока работает, и второе сканирование на той же
    # машине упало бы («cache may be in use by another process»).
    env:
      TAG: scan-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Образы Docker Hub — через зеркало Google: с общих адресов машин
      # GitHub Docker Hub режет скачивание без входа (как в ci.yaml).
      - name: Docker Hub through a mirror
        if: runner.environment == 'github-hosted'
        run: |
          conf=/etc/docker/daemon.json
          current=$(sudo cat "$conf" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' \
            | sudo tee "$conf" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'
      - name: Build image
        run: docker build -t "kronto-api:$TAG" .
      # Сканер — официальный образ с ghcr (без лимитов Docker Hub); tag
      # latest осознанно: устаревший сканер пропускает новые проверки, а
      # его результат не входит в поставку. Закрепить по digest — RISKS №18.
      - name: Pull scanner
        run: docker pull -q ghcr.io/aquasecurity/trivy:latest
      # Падает на HIGH/CRITICAL, для которых уже есть исправление: без
      # исправления сборку не спасти, такие — в отчёт, не в блокировку.
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy/$RUNNER_NAME:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --pkg-types os,library "kronto-api:$TAG"
      # Образ фронтенда (nginx со статикой) — тот же порог.
      - name: Build web image
        run: docker build -t "kronto-web:$TAG" frontend
      - name: Scan web image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy/$RUNNER_NAME:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --pkg-types os,library "kronto-web:$TAG"
      # tests/live — стенды для живых проверок коннекторов на машине
      # разработчика (Samba AD DC работает от root по своей природе); в
      # образы и на сервер они не попадают.
      - name: Scan Dockerfile and compose for misconfiguration
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" -v "$HOME/.cache/trivy/$RUNNER_NAME:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:latest config \
            --exit-code 1 --severity HIGH,CRITICAL --skip-dirs "**/tests/live" /work
      # Состав образа (CycloneDX) — для сертификации и разбора инцидентов:
      # «есть ли у нас пакет X версии Y» отвечается без пересборки.
      - name: SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -v "$HOME/.cache/trivy/$RUNNER_NAME:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:latest image \
            --format cyclonedx --output /work/sbom.cdx.json "kronto-api:$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
      - name: Remove images
        if: always()
        run: docker image rm -f "kronto-api:$TAG" "kronto-web:$TAG" >/dev/null 2>&1 || true
