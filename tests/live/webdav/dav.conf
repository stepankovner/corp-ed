# WebDAV стенда: /dav/ — общее дерево для всех пользователей, /dav/Кадры/ —
# только ivan (как общая папка NAS с правами на одну учётку).
ServerName 127.0.0.1
SSLEngine on
SSLCertificateFile /tls/cert.pem
SSLCertificateKeyFile /tls/key.pem
DavLockDB /dav/locks/lockdb

Alias /dav /dav/files
<Directory "/dav/files">
    Dav On
    AuthType Basic
    AuthName "kronto-stand"
    AuthUserFile /usr/local/apache2/users
    Require valid-user
</Directory>
<Directory "/dav/files/Кадры">
    Require user ivan
</Directory>
