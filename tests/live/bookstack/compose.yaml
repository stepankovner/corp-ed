# BookStack для живой проверки вида `bookstack`: образ linuxserver/bookstack,
# MariaDB и TLS-прокси на 127.0.0.1. Только для тестов на своей машине или в
# песочнице: ключ приложения и пароли ниже выдуманные, только для стенда.
#
#   python -m tests.live.dav_stand tls ~/dav-tls
#   DAV_TLS_DIR=~/dav-tls docker compose -f tests/live/bookstack/compose.yaml up -d
#   дальше — seed.py и тесты: README.md рядом.
name: kronto-live-bookstack

services:
  db:
    image: mariadb:${MARIADB_VERSION:-11.4}
    environment:
      MARIADB_ROOT_PASSWORD: kronto-stand-root
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: kronto-stand-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  bookstack:
    image: lscr.io/linuxserver/bookstack:${BOOKSTACK_VERSION:-v26.09.1-ls288}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      APP_URL: "https://127.0.0.1:${BOOKSTACK_PORT:-8460}"
      APP_KEY: "base64:a3JvbnRvLWJvb2tzdGFjay1zdGFuZC1vbmx5LWtleSE="
      # Перед BookStack — nginx стенда: доверять его X-Forwarded-*.
      APP_PROXIES: "*"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: kronto-stand-db
      # Лимит API по умолчанию (180 в минуту) не меняется: как в бою.
    volumes:
      - bookstack:/config
      - ./no-ipv6.sh:/custom-cont-init.d/10-no-ipv6.sh:ro

  tls:
    image: nginx:${NGINX_VERSION:-1.31.6-alpine}
    depends_on: [bookstack]
    environment:
      UPSTREAM: http://bookstack:80
    volumes:
      - ../tls-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${DAV_TLS_DIR:?сертификат стенда — см. README}:/tls:ro
    ports:
      - "127.0.0.1:${BOOKSTACK_PORT:-8460}:443"

volumes:
  bookstack:
