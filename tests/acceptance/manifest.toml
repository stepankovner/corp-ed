# MediaWiki: право чтения одно на всю вики, а Lockdown закрывает пространства
# имён, и API этого не показывает. Подключение поэтому забирает только
# пространство открытой зоны; остальные зоны лежат в вики (каждая — своё
# пространство под Lockdown), но в kronto попадать не должны.
[systems.mediawiki]
kind = "mediawiki"
title = "MediaWiki"
stand = "docker"
storage = "pages"
modules = ["pages"]
accounts = "all"
synced_zones = ["public"]
docs = ["@small", "SV-HR-005", "SV-SAL-004"]

