# Манифест набора для глобальной проверки коннекторов kronto.
#
# Одна вымышленная компания — ООО «Северный ветер» — и её документы лежат
# во всех системах. Здесь записано: кто работает, какие документы где
# лежат и кто ДОЛЖЕН их видеть. Сценарий (`python -m tests.acceptance.run`)
# заводит эту компанию в базе kronto, синхронизирует систему через ядро и
# сверяет с манифестом, кто из сотрудников что видит (правило видимости
# ядра — `chunk_repository.visible_to`, то же, что у поиска ассистента).
# Кто НЕ должен видеть документ, сценарий выводит сам: все, кого нет в
# readers его зоны.
#
# Всё вымышленное: имена, почты (@severny-veter.test), реквизиты.
# Формат и правила — README.md рядом.

[company]
name = "ООО «Северный ветер»"
code = "severny-veter"
domain = "severny-veter.test"
headcount = 120
# Сотрудников в справочнике corpus/staff.xlsx — все 120 (генератор
# build.py); в манифесте — те, у кого есть учётные записи в системах.

# --- отделы ---------------------------------------------------------------

