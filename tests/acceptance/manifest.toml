# --- системы -------------------------------------------------------------------
# kind — вид подключения в kronto; stand — docker (свой стенд, сценарий
# засевает его сам) или cloud (кабинет заводит владелец продукта —
# OWNER-CHECKLIST.md; сценарий читает учётные данные и сверяет).
# storage — как система хранит документы: "files" (файлы как есть, любой
# формат) или "pages" (страницы Markdown, файлы — вложениями не кладём).
# accounts — у кого в системе есть учётная запись: "all" или [cloud].accounts.
# Шаги (ниже) применяются к тем документам, которые в системе лежат.

[systems.bookstack]
kind = "bookstack"
title = "BookStack"
stand = "docker"
storage = "pages"
modules = ["pages"]
accounts = "all"
docs = ["@small", "SV-HR-005", "SV-LEG-005", "SV-SAL-004", "SV-IT-002", "SV-PAY-004"]

[systems.nextcloud]
kind = "nextcloud"
title = "Nextcloud"
stand = "docker"
storage = "files"
modules = ["files"]
accounts = "all"
docs = [
  "@public_core", "@public_extra", "@hr_all", "@payroll_all", "@accounting_all",
  "@sales_all", "@it_all", "@legal_all", "@management_all",
]

[systems.owncloud]
kind = "owncloud"
title = "ownCloud"
stand = "docker"
storage = "files"
modules = ["files"]
accounts = "all"
docs = ["@small", "SV-GEN-006", "SV-HR-005", "SV-SAL-004", "SV-IT-002"]

[systems.seafile]
kind = "seafile"
title = "Seafile"
stand = "docker"
storage = "files"
modules = ["files"]
accounts = "all"
docs = ["@small", "SV-SAL-005", "SV-GEN-013"]

[systems.webdav]
kind = "webdav"
title = "WebDAV (NAS, Apache mod_dav)"
stand = "docker"
storage = "files"
modules = ["files"]
accounts = "all"
docs = ["@small"]

[systems.outline]
kind = "outline"
title = "Outline (своя установка)"
stand = "docker"
storage = "pages"
modules = ["documents"]
accounts = "all"
docs = ["@small", "SV-HR-005", "SV-LEG-005", "SV-SAL-004"]

# Тестовая лицензия Atlassian (Confluence и Jira) — на 10 пользователей, из
# них два заняты служебными учётками (admin, svc-kronto): остаются восемь
# сотрудников. По одному из каждого отдела и из каждой закрытой зоны нельзя —
# берутся те, кто нужен шагам (petrenko, lebedeva) и обе стороны закрытых зон.
[systems.confluence_dc]
kind = "confluence"
title = "Confluence Data Center"
stand = "docker"
storage = "pages"
modules = ["pages"]
accounts = ["vetrov", "belova", "petrenko", "kuznetsova", "volkov", "lebedeva", "ershov", "nikitina"]
docs = ["@small", "SV-HR-005", "SV-SAL-004", "SV-IT-002"]

[systems.jira_dc]
