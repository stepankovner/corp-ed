# --- шаги изменений -------------------------------------------------------
# Порядок важен: каждый шаг идёт после предыдущего и повторной
# синхронизации. op:
#   edit   — править документ: в конец добавляется абзац с меткой (text);
#   delete — удалить документ из системы;
#   revoke — отозвать доступ сотрудника: к зоне (zone) или ко всему (без zone);
#   move   — перенести документ в другую зону (в закрытую папку).
# Если документа в системе нет, операция для неё пропускается.

[[steps]]
id = "edit"
title = "Правка документов"
ops = [
  { op = "edit", doc = "SV-SAL-001", text = "ПРАВКА-1: цена ВГ-1500 с 1 ноября — 195 000 рублей." },
  { op = "edit", doc = "SV-GEN-004", text = "ПРАВКА-2: с 1 ноября заявление на отпуск подаётся за 21 календарный день." },
  { op = "edit", doc = "SV-PAY-002", text = "ПРАВКА-3: квартальная премия — до 45 процентов оклада." },
]

[[steps]]
id = "delete"
title = "Удаление документов"
ops = [
  { op = "delete", doc = "SV-GEN-005" },
  { op = "delete", doc = "SV-LEG-004" },
]

[[steps]]
id = "revoke"
title = "Отзыв доступа у сотрудников"
ops = [
  { op = "revoke", login = "petrenko", zone = "payroll" },
  { op = "revoke", login = "lebedeva" },
]

[[steps]]
id = "move"
title = "Перенос в закрытую папку"
ops = [
  { op = "move", doc = "SV-SAL-002", zone = "management" },
  { op = "move", doc = "SV-GEN-018", zone = "hr" },
]
