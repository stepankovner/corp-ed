# --- зоны: кто читает -------------------------------------------------------
# Селекторы readers: all | dept:<отдел> | group:<группа> | login:<логин>.
# Зона в системе — это папка (книга, пространство, коллекция) со своими
# правами; документ наследует права зоны, где лежит.

[zones.public]
title = "Общие"
readers = ["all"]

[zones.hr]
title = "Кадры"
readers = ["dept:hr"]

[zones.accounting]
title = "Бухгалтерия"
readers = ["dept:accounting"]

[zones.sales]
title = "Продажи"
readers = ["dept:sales"]

[zones.it]
title = "ИТ"
readers = ["dept:it"]

[zones.legal]
title = "Юристы"
readers = ["dept:legal"]

[zones.management]
title = "Руководство"
readers = ["dept:management"]

[zones.payroll]
title = "Зарплаты (закрыто)"
readers = ["group:payroll"]
closed = true

[zones.awards]
title = "Приказы о премиях (закрыто)"
readers = ["group:managers", "group:payroll"]
closed = true

[zones.disputes]
title = "Юридические споры (закрыто)"
readers = ["dept:legal", "login:vetrov"]
closed = true

