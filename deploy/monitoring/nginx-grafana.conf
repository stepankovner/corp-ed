# Grafana стенда (deploy/monitoring/compose.yaml) — внутри server-блока
# kronto.conf через include /etc/nginx/kronto.d/*.conf. Ставит bootstrap.sh.
# Вход — пароль Grafana (/etc/corp-ed/monitoring.env), регистрации нет.
location /grafana/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
