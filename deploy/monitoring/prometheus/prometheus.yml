# Что собирает Prometheus стенда. Имена api и worker — сервисы compose.yaml
# приложения (сеть app); api отвечает на /metrics только частным адресам.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stand: stage

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Весь путь сотрудника изнутри: база, Redis, пульс воркера.
  - job_name: ready
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: ["http://api:8000/health/ready"]
    relabel_configs: &probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Как у пользователя: TLS и nginx этого хоста; отсюда же срок сертификата.
  - job_name: public
    metrics_path: /probe
    params:
      module: [https_public]
    file_sd_configs:
      - files: ["/etc/prometheus/public-targets.yml"]
    relabel_configs: *probe

  - job_name: monitoring
    static_configs:
      - targets: ["localhost:9090", "alertmanager:9093", "loki:3100", "alloy:12345"]
