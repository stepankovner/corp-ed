# Внешний прокси Kronto (nginx на хосте): TLS, /api и /health — в API,
# остальное — в контейнер со статикой фронтенда. Один origin: браузеру не
# нужен CORS, токены не уходят на другой домен. См. docs/DEPLOY.md §5.
#
# Сертификат — certbot (или свой); имя — боевое, оно же в ALLOWED_HOSTS.
# bootstrap.sh подставляет имя стенда вместо боевого во всём файле.

# Запрос не к нашему имени (сканеры по IP, чужой Host) — соединение
# закрывается без ответа. На 443 — без сертификата: TLS отклоняется до
# ответа (ssl_reject_handshake, nginx 1.19.4+), имя стенда не раскрывается.
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name app.krontoai.ru;
    # Имя — своё, а не $host: адрес перехода не берётся из запроса.
    return 301 https://app.krontoai.ru$request_uri;
}

server {
    # «listen … http2», а не «http2 on»: директива http2 появилась в nginx
    # 1.25.1, а в Ubuntu 24.04 — 1.24 (стенд 02.10: «unknown directive»).
    # Новый nginx на эту запись только предупреждает.
    listen 443 ssl http2;
    server_name app.krontoai.ru;

    ssl_certificate     /etc/letsencrypt/live/app.krontoai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.krontoai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # HSTS — здесь, на каждом ответе по HTTPS: страницы сайта и приложения,
    # ошибки, Grafana. Действует во всех location без своих add_header.
    # Приложение в production шлёт тот же заголовок на /api и /health —
    # там он скрыт (proxy_hide_header), чтобы источник был один.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Загрузка файлов: не меньше MAX_UPLOAD_BYTES (25 МБ) плюс заголовки формы.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем, а не дописываем: заголовок клиента — подделка.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        # Синхронный ответ (/faq/ask) при медленной модели: до 3 попыток по
        # 5 с соединения и 60 с чтения плюс пауза между ними (llm/yandex*.py,
        # llm/retry.py) — около 200 с. Короче — nginx отдаст 504, а
        # приложение всё равно потратит вызов. Поток ответа чата шлёт пустое
        # событие раз в 15 с и сам выключает буфер nginx
        # (X-Accel-Buffering: no) — ему таймаут не мешает.
        proxy_read_timeout 210s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_hide_header Strict-Transport-Security;
    }

    # Весь путь: база, Redis, воркер — для внешнего чекера (Ping-Admin).
    location = /health/ready {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_hide_header Strict-Transport-Security;
    }

    # Служебные адреса API (метрики, документация) сюда не проксируются, а
    # в статике их нет: без этих строк приложение отдало бы на них свою
    # страницу с кодом 200. Явный 404 — честнее для сканеров и проверок.
    location = /metrics { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Дополнения хоста: на стенде — Grafana (bootstrap.sh). Пусто — ничего.
    include /etc/nginx/kronto.d/*.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
