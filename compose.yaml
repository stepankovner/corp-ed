services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: >
      uvicorn corp_ed.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql+asyncpg://corp_ed:${POSTGRES_PASSWORD}@db:5432/corp_ed
      - SECRET_KEY=${SECRET_KEY}
      - YC_FOLDER_ID=${YC_FOLDER_ID}
      - YC_API_KEY=${YC_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=corp_ed
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=corp_ed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corp_ed"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
