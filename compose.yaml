# Базовая конфигурация — как в бою: без публикации портов базы и Redis,
# без --reload, приложение под ролью corp_ed_app (без DDL и BYPASSRLS),
# миграции — отдельным одноразовым контейнером под владельцем схемы.
#
#   docker compose up                    # + compose.override.yaml: разработка
#   docker compose -f compose.yaml up    # только этот файл: боевая форма
#
# Переменные — из .env (см. .env.example). См. docs/DEPLOY.md.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: kronto-api:local
  env_file: .env
  environment:
    # Приложение ходит в базу НЕ владельцем схемы: RLS для него действует,
    # таблицы оно не создаёт и не удаляет (deploy/postgres/10-app-role.sh).
    - DATABASE_URL=postgresql+asyncpg://corp_ed_app:${APP_DB_PASSWORD}@db:5432/corp_ed
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    # Прокси на хосте ходит в опубликованный порт api, и Docker передаёт
    # соединение с адреса шлюза подсети (ниже, networks.default), а не с
    # 127.0.0.1. Верим X-Forwarded-For только от него: иначе все
    # пользователи для лимитов по IP и журнала аудита — один адрес.
    - FORWARDED_ALLOW_IPS=172.30.61.1
  restart: unless-stopped

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - MIGRATIONS_DATABASE_URL=postgresql+asyncpg://corp_ed:${POSTGRES_PASSWORD}@db:5432/corp_ed
      - DATABASE_URL=postgresql+asyncpg://corp_ed:${POSTGRES_PASSWORD}@db:5432/corp_ed
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    # Только для TLS-прокси на этом же хосте (deploy/nginx/kronto.conf):
    # без 127.0.0.1 Docker откроет порт на всех интерфейсах в обход
    # файрвола, и API будет доступен по HTTP мимо прокси.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "corp_ed.worker"]
    # HTTP-порта у воркера нет: проверка образа (GET /health) здесь всегда
    # красная. Живость — по файлу-пульсу, его воркер обновляет раз в 30 с.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/corp-ed-worker.alive') < 120 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Статика фронтенда (frontend/Dockerfile). Внешний TLS-прокси ведёт /api
  # и /health на api:8000, остальное — сюда (deploy/nginx/kronto.conf).
  web:
    build:
      context: frontend
    image: kronto-web:local
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Реранкер (M3, BH-32) — только с профилем: COMPOSE_PROFILES=reranker
  # в .env и RAG_RERANK_MODEL=<модель>. Модель — deploy/reranker/fetch-model.sh
  # (сеть сервису не нужна: модель читается с диска). Без root, файловая
  # система только для чтения; процессор ограничен, чтобы пересортировка
  # не отнимала его у API и воркера целиком.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    profiles: ["reranker"]
    command: ["--model-id", "/model", "--port", "8080", "--max-client-batch-size", "64", "--auto-truncate"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${RERANK_MODEL_DIR:-/var/lib/kronto/reranker-model}:/model:ro
    cpus: ${RERANK_CPUS:-3}
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Образы базы и Redis закреплены по digest индекса (все архитектуры), как
  # реранкер: тег pg16 или 7-alpine перезаписывается при каждом выпуске, и
  # без digest на сервер приехал бы образ, которого никто не проверял.
  # Обновляет Dependabot (docker-compose в .github/dependabot.yml).
  db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      - POSTGRES_USER=corp_ed
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=corp_ed
      # Роль приложения создаётся при первой инициализации тома.
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corp_ed -d corp_ed"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Только память: счётчики лимитов и слоты квоты эмбеддингов не нужны
    # после перезапуска, а дамп на диске — лишняя копия данных.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped

# Подсеть закреплена, чтобы адрес шлюза (FORWARDED_ALLOW_IPS в x-app) был
# известен заранее. Если она занята на хосте — сменить обе строки и адрес
# в FORWARDED_ALLOW_IPS.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.61.0/24
          gateway: 172.30.61.1

volumes:
  postgres_data:
