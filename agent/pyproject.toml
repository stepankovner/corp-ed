[project]
name = "kronto-agent"
version = "0.1.0"
description = "Агент сетевых папок kronto: обход SMB, права NTFS, отправка в kronto"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Лицензии: smbprotocol, pyspnego — MIT; httpx — BSD-3-Clause;
# ldap3 — LGPL-3.0 (почему допустимо — README.md, «Лицензии»).
dependencies = [
    "httpx>=0.28.1",
    "ldap3>=2.9.1",
    "smbprotocol>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.16",
]

[project.scripts]
kronto-agent = "kronto_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronto_agent"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (стиль из PEP 8)
    "W",    # pycodestyle warnings
    "F",    # pyflakes (неиспользуемые импорты/переменные, реальные ошибки)
    "I",    # isort (сортировка импортов)
    "N",    # pep8-naming (правила именования)
    "UP",   # pyupgrade (модернизация устаревшего синтаксиса)
    "B",    # flake8-bugbear (потенциальные баги)
    "SIM",  # flake8-simplify (упрощение кода)
    "S",    # flake8-bandit (типовые дыры: shell=True, eval, слабые хеши, секреты в коде)
]

[tool.ruff.lint.isort]
known-first-party = ["kronto_agent"]

[tool.ruff.lint.per-file-ignores]
# Тесты: assert — их язык; пароли и ключи в них ненастоящие.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
python_version = "3.12"
strict = true

# Библиотеки без аннотаций (или с частичными): обёрнуты в smb.py и
# directory.py, наружу — только свои типы.
[[tool.mypy.overrides]]
module = ["ldap3", "ldap3.*", "smbclient", "smbclient.*", "smbprotocol", "smbprotocol.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["kronto_agent.smb"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Живые тесты (tests/live) без стенда пропускаются сами.
